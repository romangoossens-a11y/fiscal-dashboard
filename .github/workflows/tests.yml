name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/test_smoke_page.py

  # Loads index.html in headless Chromium: all countries render, no console
  # errors, nothing fetched from third party hosts.
  page-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_smoke_page.py

  # The compiled CSS and vendor files are committed because GitHub Pages has
  # no build step. Fail if they no longer match the sources.
  assets-up-to-date:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- assets/ index.html || (echo "Run npm run build and commit assets/ and index.html" && exit 1)
