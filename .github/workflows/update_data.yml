name: Update Fiscal Data

on:
  schedule:
    # Monday is the normal refresh. Thursday is a quiet recovery run if the
    # first schedule was delayed or a source was temporarily unavailable.
    # Minute 17 avoids the heavier GitHub Actions load at the start of an hour.
    - cron: '17 8 * * 1,4'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race each other on the same branch.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A code fault stops the job before any data is written, so the last
      # good file stays live. Data problems never stop it (see pipeline/run.py).
      - name: Run tests
        run: python -m pytest -q

      - name: Fetch and compute fiscal data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fiscal_data.json data/fiscal_data.js data/history.json data/imf_vintages.json
          git diff --staged --quiet || git commit -m "chore: update fiscal data [$(date -u '+%Y-%m-%d')]"

      - name: Push changes
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
